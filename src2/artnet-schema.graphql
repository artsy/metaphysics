type Query {
  publicArtworkListings(
    # sortBy: [SortByClause_Input!]
    # subscriptionId: ID!
    # subscriptionScope: SubscriptionScope
    # preferences: ArtListingPreferences_Input
    freeformTextQuery: String
    filters: ArtListingFilters_Input
    page: Int!
    pageSize: Int!
  ): ArtworkListingResults!
}

type ArtworkListingResults {
  results: [ArtListingSummary!]!
  count: BigInt
  warnings: [Warning!]!
}

interface ArtListingSummary {
  id: ID!
  listingDomain: ListingDomain!
  # artMarketInstitution: ArtMarketInstitution
  saleName: String
  saleCountries: [String!]!
  # saleStatus: SaleStatus
  # prices: [ArtListingSalePrice!]!
  saleId: ID
  # featuredImage: Image
  lastUpdated: DateTime!
  listedDate: DateTime!
  isRedacted: Boolean
  # events: [ArtListingEvent!]!

  # TODO - this needs to be added to the REST API.
  # Making it nullable for now.
  internalID: ID

  # listingData:
  title: String
  artworks: [ArtworkSummary!]!
  uri: String
  externalUrl: String
}

enum ListingDomain {
  PDB
  PDB_TEASER
  GALLERY
  ARTNET_AUCTION
}

type LotSummary implements ArtListingSummary {
  timing: [Timing!]!

  # listingData:
  catalogLotNumber: String
  saleNumber: String
  artListingDetailId: ID!

  # inherited:
  id: ID!
  listingDomain: ListingDomain!
  # artMarketInstitution: ArtMarketInstitution
  saleName: String
  saleCountries: [String!]!
  # saleStatus: SaleStatus
  # prices: [ArtListingSalePrice!]!
  saleId: ID
  # featuredImage: Image
  lastUpdated: DateTime!
  listedDate: DateTime!
  isRedacted: Boolean
  # events: [ArtListingEvent!]!
  # TODO - this needs to be added to the REST API.
  # Making it nullable for now.
  internalID: ID
  title: String
  artworks: [ArtworkSummary!]!
  uri: String
  externalUrl: String
}

type GalleryListingSummary implements ArtListingSummary {
  # inherited:
  id: ID!
  listingDomain: ListingDomain!
  # artMarketInstitution: ArtMarketInstitution
  saleName: String
  # timing: [Timing!]!
  saleCountries: [String!]!
  # saleStatus: SaleStatus
  # prices: [ArtListingSalePrice!]!
  saleId: ID
  # featuredImage: Image
  lastUpdated: DateTime!
  listedDate: DateTime!
  isRedacted: Boolean
  # events: [ArtListingEvent!]!
  # TODO - this needs to be added to the REST API.
  # Making it nullable for now.
  internalID: ID
  title: String
  artworks: [ArtworkSummary!]!
  uri: String
  externalUrl: String
}

type Timing {
  start: CustomDateTime!
  end: CustomDateTime
}

type ArtworkSummary {
  # TODO needs to be added to REST API
  # (resolver is inventing a fake ID for now)
  id: ID!

  title: String!
  creationYearFrom: Int
  # creationYearFromEra: Era
  creationYearFromQualifier: String
  creationYearTo: Int
  # creationYearToEra: Era
  creationYearToQualifier: String
  classifications: [KeyValuePair!]!
  creator: CreatorSummary
  # dimensions: Dimensions
  edition: String
  media: [String!]!
  objectTypes: [KeyValuePair!]!
  # timelineEvents: [ArtworkSummaryTimelineEvent!]!
  lastUpdated: DateTime!
  uri: String
}

interface CreatorSummary {
  id: ID!
  name: String!
  aliases: [String!]!
  attributionQualifier: String
  movements: [KeyValuePair!]!
  uri: String
}

type CollaborationSummary implements CreatorSummary {
  artists: [ArtworkSummaryArtist!]!

  # inherited:
  id: ID!
  name: String!
  aliases: [String!]!
  attributionQualifier: String
  movements: [KeyValuePair!]!
  uri: String
}

type ArtistSummary implements CreatorSummary {
  birthYear: Int
  birthYearEra: Era
  deathYear: Int
  deathYearEra: Era
  nationalities: [KeyValuePair!]!

  # inherited:
  id: ID!
  name: String!
  aliases: [String!]!
  attributionQualifier: String
  movements: [KeyValuePair!]!
  uri: String
}

type ManufacturerSummary implements CreatorSummary {
  # inherited:
  id: ID!
  name: String!
  aliases: [String!]!
  attributionQualifier: String
  movements: [KeyValuePair!]!
  uri: String
}

type Warning {
  code: WarningCode!
  keys: [String!]!
  message: String!
}

enum WarningCode {
  REDACTED
  ACCOUNT_BALANCE
  RESTRICTED
}

